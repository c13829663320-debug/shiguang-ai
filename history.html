<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光AI · 时光轴</title>
  <meta name="theme-color" content="#1e2623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拾光AI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
  <div id="app"></div>

  <script src="mock.js?v=20"></script>
  <script src="api.js?v=20"></script>
  <script src="components.js?v=21"></script>
  <script>
    (function () {
      const app = document.getElementById('app');
      const params = new URLSearchParams(location.search);
      const state = { query: params.get('query') || '', type: params.get('type') || '', tag: params.get('tag') || '', pinned: false, day: null };
      const startToday = new Date(); startToday.setHours(0, 0, 0, 0);
      let cal = { year: startToday.getFullYear(), month: startToday.getMonth() };
      const dateParam = params.get('date');
      if (dateParam && /^\d{4}-\d{2}-\d{2}$/.test(dateParam)) {
        const picked = new Date(`${dateParam}T00:00:00`);
        if (!Number.isNaN(picked.getTime())) {
          state.day = picked.getTime();
          cal = { year: picked.getFullYear(), month: picked.getMonth() };
        }
      }
      const debounce = (fn, ms) => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); }; };

      function filtered() {
        const range = {};
        if (state.day) {
          const dayStart = new Date(state.day); dayStart.setHours(0, 0, 0, 0);
          range.from = dayStart.getTime();
          range.to = range.from + 86400000 - 1;
        }
        return MemoryStore.listRecords({
          query: state.query, type: state.type, tag: state.tag,
          pinned: state.pinned || undefined, ...range
        });
      }

      function render() {
        const tags = MemoryStore.tags().slice(0, 8);
        app.innerHTML = `
          ${renderSidebar('history')}
          <main class="app-main">
            ${renderPageHeader({
              title: '时光轴', subtitle: '所有记忆，按发生的时间排列',
              actions: `
                <button class="btn btn-secondary" id="export-center">${getIcon('download', 16)}<span class="optional"> 导出</span></button>
                <button class="btn btn-primary" data-action="new-record">${getIcon('plus', 16)} 记一笔</button>`
            })}
            <div class="page-content narrow">
              <div class="toolbar">
                <div class="search-box" role="search">${getIcon('search', 16)}<input class="input" id="search-input" type="search" aria-label="搜索记忆" placeholder="搜索标题、正文或标签…" value="${SG.esc(state.query)}" autocomplete="off"><div class="search-history" id="search-history" hidden></div></div>
                <div class="filter-pills" id="type-pills">
                  <button class="pill ${state.type ? '' : 'active'}" data-type="">全部</button>
                  ${Object.entries(SG.typeMap).map(([key, value]) => `<button class="pill ${state.type === key ? 'active' : ''}" data-type="${key}">${value[0]}</button>`).join('')}
                  <button class="pill ${state.pinned ? 'active' : ''}" data-type="__pin">${getIcon('pin', 13)} 置顶</button>
                </div>
              </div>
              ${tags.length ? `<div class="filter-pills" id="tag-pills" style="margin:-12px 0 24px">
                <span class="muted small" style="align-self:center">常用标签：</span>
                <button class="pill ${state.tag ? '' : 'active'}" data-tag="">不限</button>
                ${tags.map(tag => `<button class="pill ${state.tag === tag.name ? 'active' : ''}" data-tag="${SG.esc(tag.name)}">${SG.esc(tag.name)} · ${tag.count}</button>`).join('')}
              </div>` : ''}
              <div id="calendar-root"></div>
              <div id="timeline-root"></div>
            </div>
          </main>`;

        const input = document.getElementById('search-input');
        input.addEventListener('input', debounce(event => { state.query = event.target.value; renderList(); }, 200));
        input.addEventListener('focus', () => paintHistory(true));
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            const value = input.value.trim();
            if (!value) return;
            state.query = value; SG.rememberSearch(value); paintHistory(false); renderList();
          } else if (event.key === 'Escape') { paintHistory(false); input.blur(); }
        });
        input.addEventListener('blur', () => setTimeout(() => paintHistory(false), 120));
        const historyBox = document.getElementById('search-history');
        historyBox.addEventListener('mousedown', event => event.preventDefault());
        historyBox.addEventListener('click', event => {
          const btn = event.target.closest('[data-history]'); if (!btn) return;
          const value = btn.dataset.history;
          if (value === '__clear') { SG.clearSearchHistory(); paintHistory(true); return; }
          state.query = value; input.value = value; SG.rememberSearch(value);
          paintHistory(false); renderList();
        });
        paintHistory(false);
        document.getElementById('type-pills').addEventListener('click', event => {
          const btn = event.target.closest('[data-type]'); if (!btn) return;
          if (btn.dataset.type === '__pin') state.pinned = !state.pinned;
          else state.type = btn.dataset.type;
          render();
        });
        document.getElementById('tag-pills')?.addEventListener('click', event => {
          const btn = event.target.closest('[data-tag]'); if (!btn) return;
          state.tag = btn.dataset.tag; render();
        });
        document.getElementById('export-center').onclick = () => {
          if (typeof window.openExportCenter !== 'function') { showToast('页面资源正在更新，请刷新后重试。', 'info'); return; }
          openExportCenter();
        };
        renderCalendar();
        renderList();
      }

      function renderCalendar() {
        const root = document.getElementById('calendar-root');
        if (!root) return;
        const data = MemoryStore.monthCounts(cal.year, cal.month);
        const today = new Date();
        const isCurrent = cal.year === today.getFullYear() && cal.month === today.getMonth();
        const level = count => count === 0 ? 0 : count >= 5 ? 4 : count >= 3 ? 3 : count === 2 ? 2 : 1;
        const blanks = Array.from({ length: data.firstWeekday }, () => '<span class="calendar-cell blank"></span>').join('');
        const cells = Array.from({ length: data.daysInMonth }, (_, index) => {
          const day = index + 1;
          const date = new Date(cal.year, cal.month, day);
          const count = data.counts[day] || 0;
          const isToday = date.toDateString() === today.toDateString();
          const isActive = Boolean(state.day) && new Date(state.day).toDateString() === date.toDateString();
          const isFuture = date.getTime() > startToday.getTime();
          return `<button class="calendar-cell lv${level(count)} ${isToday ? 'today' : ''} ${isActive ? 'active' : ''} ${isFuture ? 'future' : ''}" data-day="${day}" title="${cal.month + 1} 月 ${day} 日 · ${count} 条记忆" ${isFuture ? 'disabled' : ''}><span class="calendar-num">${day}</span></button>`;
        }).join('');
        root.innerHTML = `<section class="card calendar-section">
          <div class="calendar-head">
            <div><div class="section-kicker">MEMORY CALENDAR</div><h2 class="section-title">时光日历</h2></div>
            <div class="row wrap">
              <span class="calendar-total">本月 ${data.total} 条</span>
              <div class="row calendar-nav">
                <button class="btn btn-ghost btn-icon btn-sm" data-cal="prev" aria-label="上个月">${getIcon('left', 15)}</button>
                <strong class="calendar-month">${cal.year} 年 ${cal.month + 1} 月</strong>
                <button class="btn btn-ghost btn-icon btn-sm" data-cal="next" aria-label="下个月" ${isCurrent ? 'disabled' : ''}>${getIcon('right', 15)}</button>
              </div>
              ${isCurrent ? '' : `<button class="btn btn-secondary btn-sm" data-cal="today">${getIcon('refresh', 13)} 回到本月</button>`}
            </div>
          </div>
          <div class="calendar-weekdays">${['一', '二', '三', '四', '五', '六', '日'].map(day => `<span>${day}</span>`).join('')}</div>
          <div class="calendar-grid">${blanks}${cells}</div>
          <div class="calendar-legend">
            <span class="muted small">记录密度</span>
            <span class="legend-cell lv0"></span><span class="legend-cell lv1"></span><span class="legend-cell lv2"></span><span class="legend-cell lv3"></span><span class="legend-cell lv4"></span>
            <span class="muted small">少 → 多</span>
            ${state.day ? `<button class="btn btn-ghost btn-sm" id="clear-day">${getIcon('x', 13)} 清除日期筛选</button>` : ''}
          </div>
        </section>`;
        root.querySelectorAll('[data-cal]').forEach(btn => {
          btn.onclick = () => {
            const action = btn.dataset.cal;
            if (action === 'today') cal = { year: today.getFullYear(), month: today.getMonth() };
            else {
              const cursor = new Date(cal.year, cal.month + (action === 'prev' ? -1 : 1), 1);
              cal = { year: cursor.getFullYear(), month: cursor.getMonth() };
            }
            renderCalendar();
          };
        });
        root.querySelectorAll('[data-day]').forEach(btn => {
          btn.onclick = () => {
            if (btn.classList.contains('lv0') && !btn.classList.contains('active')) {
              showToast(`${cal.month + 1} 月 ${btn.dataset.day} 日还没有留下记忆`, 'info');
              return;
            }
            const stamp = new Date(cal.year, cal.month, Number(btn.dataset.day)).getTime();
            const sameDay = state.day && new Date(state.day).toDateString() === new Date(stamp).toDateString();
            state.day = sameDay ? null : stamp;
            renderCalendar(); renderList();
          };
        });
        root.querySelector('#clear-day')?.addEventListener('click', () => { state.day = null; renderCalendar(); renderList(); });
      }

      function paintHistory(open) {
        const box = document.getElementById('search-history');
        if (!box) return;
        const list = SG.searchHistoryList();
        if (!list.length) { box.hidden = true; return; }
        box.innerHTML = `<div class="search-history-head"><span>最近搜索</span><button class="btn btn-ghost btn-sm" data-history="__clear">清空</button></div>
          ${list.map(item => `<button class="search-history-item" data-history="${SG.esc(item)}">${getIcon('clock', 13)}<span>${SG.esc(item)}</span></button>`).join('')}`;
        box.hidden = !open;
      }

      function relevance(record) {
        const query = state.query.trim().toLowerCase();
        if (!query) return 0;
        const title = record.title.toLowerCase();
        const tags = record.tags.join(' ').toLowerCase();
        const content = (record.content || '').toLowerCase();
        let score = 0;
        if (title === query) score += 12;
        else if (title.startsWith(query)) score += 8;
        else if (title.includes(query)) score += 6;
        if (record.tags.some(tag => tag.toLowerCase() === query)) score += 5;
        else if (tags.includes(query)) score += 3;
        if (content.includes(query)) score += 2;
        return score;
      }

      function sortedRecords() {
        const query = state.query.trim();
        return filtered().slice().sort((a, b) =>
          (query ? relevance(b) - relevance(a) : 0) ||
          Number(b.pinned) - Number(a.pinned) ||
          b.occurredAt - a.occurredAt);
      }

      function suggestKeywords(limit = 6) {
        const seen = new Set([state.query.trim().toLowerCase()]);
        return [...SG.searchHistoryList(), ...MemoryStore.tags().map(tag => tag.name)]
          .filter(word => {
            if (!word || seen.has(word.toLowerCase())) return false;
            seen.add(word.toLowerCase()); return true;
          }).slice(0, limit);
      }

      function renderList() {
        const root = document.getElementById('timeline-root');
        if (!root) return;
        const query = state.query.trim();
        const records = sortedRecords();
        const suggestions = suggestKeywords();
        root.innerHTML = records.length ? `
          <div class="section-head" style="margin-bottom:20px">
            <div><div class="section-kicker">${query ? 'SEARCH RESULTS' : 'TIMELINE'}</div><h2 class="section-title">${query ? `找到 ${records.length} 条相关记忆` : `共 ${records.length} 条记忆`}</h2></div>
            <div class="row wrap">
              ${query ? `<span class="muted small">按相关度排序</span>` : ''}
              ${state.day ? `<button class="btn btn-ghost btn-sm" id="clear-day-inline">${getIcon('x', 13)} ${SG.formatDate(state.day)}</button>` : ''}
            </div>
          </div>
          ${query ? `<div class="search-results">${records.map(item => recordItem(item, true)).join('')}</div>` : `<div class="timeline">${buildTimeline(records)}</div>`}` :
          renderEmptyState({
            icon: 'search',
            title: query ? `没有找到「${query}」` : '没有匹配的记忆',
            description: state.day ? '这一天还没有留下记忆，换个日期或清除筛选再试。' : query ? '换个关键词，或从下面的常用词里找找。' : '换个关键词，或清除筛选条件再试一次。',
            action: `${suggestions.length ? `<div class="suggestion-block"><span class="muted small">${query ? '试试这些关键词' : '试试这些标签'}</span><div class="suggestion-chips">${suggestions.map(word => `<button class="suggestion-chip" data-suggest="${SG.esc(word)}">${SG.esc(word)}</button>`).join('')}</div></div>` : ''}<button class="btn btn-secondary" id="clear-filters">${getIcon('refresh', 15)} 清除全部筛选</button>`
          });
        root.querySelectorAll('[data-suggest]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.query = btn.dataset.suggest; SG.rememberSearch(state.query); render();
          });
        });
        root.querySelector('#clear-filters')?.addEventListener('click', () => {
          state.query = ''; state.type = ''; state.tag = ''; state.pinned = false; state.day = null; render();
        });
        root.querySelector('#clear-day-inline')?.addEventListener('click', () => {
          state.day = null; renderCalendar(); renderList();
        });
      }

      function recordItem(item, withDate) {
        const [typeName, icon] = SG.typeMap[item.type] || SG.typeMap.text;
        const excerpt = item.content || item.attachments.map(file => file.name).join('、') || '暂无文字描述';
        return `<article class="card timeline-item" tabindex="0" data-clickable aria-label="打开记忆：${SG.esc(item.title)}" onclick="openRecordDetail('${item.id}')">
          <div style="min-width:0">
            <span class="memory-type">${getIcon(icon, 14)} ${typeName}${item.pinned ? ' · <span class="pin-mark">置顶</span>' : ''}${withDate ? `<span class="result-date">${SG.formatDate(item.occurredAt, false)}</span>` : ''}</span>
            <h3 class="memory-title">${SG.highlight(item.title, state.query)}</h3>
            <p class="memory-excerpt">${SG.highlight(excerpt, state.query)}</p>
            <div class="memory-tags">${item.tags.slice(0, 4).map(tag => `<span class="tag">${SG.highlight(tag, state.query)}</span>`).join('')}</div>
          </div>
          <div>
            <div class="timeline-time">${SG.formatTime(item.occurredAt)}</div>
            <div class="timeline-actions">
              <button class="btn btn-ghost btn-sm" title="置顶" onclick="pinRecord('${item.id}', event)">${getIcon('pin', 15)}</button>
              <button class="btn btn-ghost btn-sm" title="编辑" onclick="editRecord('${item.id}', event)">${getIcon('edit', 15)}</button>
              <button class="btn btn-ghost btn-sm" title="删除" onclick="removeRecord('${item.id}', event)">${getIcon('trash', 15)}</button>
            </div>
          </div>
        </article>`;
      }

      function buildTimeline(records) {
        const groups = [];
        const byDay = new Map();
        records.forEach(record => {
          const key = new Date(record.occurredAt).toDateString();
          if (!byDay.has(key)) { byDay.set(key, []); groups.push(key); }
          byDay.get(key).push(record);
        });
        return groups.map(key => {
          const date = new Date(key);
          const items = byDay.get(key);
          return `<div class="timeline-day">
            <div class="timeline-date"><strong>${date.getMonth() + 1}月${date.getDate()}日</strong><span>${date.getFullYear()} · 周${'日一二三四五六'[date.getDay()]}</span></div>
            <div class="timeline-items">${items.map(item => recordItem(item, false)).join('')}</div>
          </div>`;
        }).join('');
      }

      window.pinRecord = (id, event) => { event.stopPropagation(); MemoryStore.togglePin(id); };
      window.editRecord = (id, event) => { event.stopPropagation(); openRecordEditor(id); };
      window.removeRecord = (id, event) => {
        event.stopPropagation();
        const record = MemoryStore.getRecord(id);
        MemoryStore.deleteRecord(id);
        showToast(`「${record ? record.title : '这条记忆'}」已移到回收站`, 'success', 5200, {
          label: '撤销',
          onClick: () => { MemoryStore.restoreRecord(id); showToast('已恢复这条记忆', 'success'); }
        });
      };

      window.addEventListener('shiguang:change', () => { renderCalendar(); renderList(); });
      render();
    })();
  </script>
</body>
</html>
