<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾光AI · 记忆助手</title>
  <meta name="theme-color" content="#1e2623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="拾光AI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=25">
</head>
<body>
  <div id="app"></div>

  <script src="mock.js?v=25"></script>
  <script src="api.js?v=20"></script>
  <script src="components.js?v=28"></script>
  <script>
    (function () {
      const app = document.getElementById('app');
      const state = { messages: [], loading: false };
      const formatAnswer = (text) => SG.esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      const userAvatarHTML = () => {
        const { avatar, name } = MemoryStore.settings();
        return avatar ? `<img src="${avatar}" alt="${SG.esc(name)}的头像">` : getIcon('smile', 15);
      };
      const typingHTML = () => `<div class="chat-message"><div class="chat-avatar">${getIcon('sparkles', 15)}</div><div class="chat-bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`;

      function render() {
        const settings = MemoryStore.settings();
        app.innerHTML = `
          ${renderSidebar('assistant')}
          <main class="app-main">
            ${renderPageHeader({
              title: '记忆助手', subtitle: '只依据你保存的记录回答，不编造事实',
              actions: `
                <a class="btn btn-secondary" href="settings.html">${getIcon('settings', 15)}<span class="optional"> AI 设置</span></a>
                <span class="badge">${MemoryAPI.configured() ? `${getIcon('sparkles', 13)} AI 增强` : `${getIcon('shield', 13)} 本地检索`}</span>`
            })}
            <div class="page-content">
              <section class="assistant-hero">
                <img src="assets/memory-constellation.jpg" alt="记忆星图">
                <div class="assistant-overlay">
                  <div class="eyebrow">PRIVATE MEMORY INTELLIGENCE</div>
                  <h2>${SG.esc(settings.name)}，关于你的记忆，<br>可以问我任何问题。</h2>
                  <p>回答只来自你保存过的记录；每条结论都会标注依据，可回溯、可追问。</p>
                  <span class="local-badge"><i aria-hidden="true"></i>${MemoryAPI.configured() ? 'AI 增强已开启 · 本地检索兜底' : '本地检索已开启'}</span>
                </div>
              </section>
              <div class="assistant-layout">
                <div class="card chat-panel">
                  <div class="chat-messages" id="chat-messages"></div>
                  <div class="chat-compose">
                    <div class="chat-compose-box">
                      <textarea class="textarea" id="ask-input" placeholder="例如：这周我做了什么？最近心情怎么样？"></textarea>
                      <button class="btn btn-dark btn-icon" id="ask-send" style="min-height:54px" title="发送" ${state.loading ? 'disabled' : ''}>${getIcon('send', 18)}</button>
                    </div>
                  </div>
                </div>
                <aside class="assistant-side stack">
                  <div class="section" style="margin-top:0">
                    <div class="section-kicker">TRY ASKING</div>
                    <div class="section-title" style="font-size:17px; margin-bottom:12px">可以这样问</div>
                    <div class="prompt-list" id="prompt-list">
                      ${['这周我做了什么？', '我最近的心情怎么样？', '关于英语学习我留下过哪些记录？', '帮我回顾一下工作的进展'].map(q => `<button class="prompt-card" data-q="${SG.esc(q)}">${getIcon('sparkles', 14)} ${SG.esc(q)}</button>`).join('')}
                    </div>
                  </div>
                  <div class="card card-padded">
                    <div class="section-kicker">RECENT</div>
                    <div class="section-title" style="font-size:17px; margin:4px 0 12px">最近问过</div>
                    <div id="recent-chats" class="stack" style="gap:8px"></div>
                  </div>
                  <div class="card card-padded small soft">
                    <div class="row" style="gap:8px; margin-bottom:8px">${getIcon('shield', 16)}<strong style="font-size:12px">它是怎么工作的</strong></div>
                    先在本地对记忆做关键词与标签检索；在设置中接入 OpenAI 兼容接口后，会把检索到的记录作为上下文生成回答，网络失败时自动回退本地模式。
                  </div>
                </aside>
              </div>
            </div>
          </main>`;

        document.getElementById('ask-send').onclick = send;
        document.getElementById('ask-input').addEventListener('keydown', event => {
          if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
        });
        document.getElementById('prompt-list').addEventListener('click', event => {
          const btn = event.target.closest('[data-q]'); if (!btn) return;
          document.getElementById('ask-input').value = btn.dataset.q; send();
        });
        renderMessages();
        renderRecent();
      }

      function renderMessages() {
        const box = document.getElementById('chat-messages');
        if (!box) return;
        if (!state.messages.length) {
          box.innerHTML = `<div class="chat-empty">从右侧挑一个问题，或直接输入开始。<br>回答只会来自你保存过的记录。</div>`;
          return;
        }
        box.innerHTML = state.messages.map(message => `
          <div class="chat-message ${message.role}">
            <div class="chat-avatar">${message.role === 'user' ? userAvatarHTML() : getIcon('sparkles', 15)}</div>
            <div style="min-width:0">
              <div class="chat-bubble">${message.role === 'user' ? SG.esc(message.content) : formatAnswer(message.content)}</div>
              ${message.role === 'assistant' && message.sources && message.sources.length ? `
                <div class="chat-sources">
                  <div class="small muted" style="margin-bottom:4px">依据的记忆：</div>
                  <div class="row wrap" style="gap:4px">${message.sources.map(source => `<button class="source-chip" onclick="openRecordDetail('${source.id}')">${getIcon('book', 12)} ${SG.esc(source.title)}</button>`).join('')}</div>
                </div>` : ''}
              ${message.role === 'assistant' && (message.mode === 'ai' || message.mode === 'local') ? `<div class="badge" style="margin-top:8px">${message.mode === 'ai' ? 'AI 增强回答' : '本地检索回答'}</div>` : ''}
              ${message.warning ? `<div class="notice error" style="margin-top:10px">${SG.esc(message.warning)}</div>` : ''}
            </div>
          </div>`).join('') + (state.loading ? typingHTML() : '');
        box.scrollTop = box.scrollHeight;
      }

      async function send() {
        const input = document.getElementById('ask-input');
        const question = input.value.trim();
        if (!question || state.loading) return;
        input.value = '';
        state.messages.push({ role: 'user', content: question });
        state.loading = true;
        renderMessages();
        try {
          const result = await MemoryAPI.ask(question);
          state.messages.push({
            role: 'assistant', content: result.answer,
            sources: result.sources, mode: result.mode, warning: result.warning
          });
        } catch (error) {
          state.messages.push({ role: 'assistant', content: `这次问答没有完成：${error.message}`, mode: 'error' });
        } finally {
          state.loading = false;
          renderMessages();
          renderRecent();
        }
      }

      function renderRecent() {
        const box = document.getElementById('recent-chats');
        if (!box) return;
        const chats = MemoryStore.chats().slice(0, 5);
        box.innerHTML = chats.length ? chats.map(chat => `
          <button class="prompt-card" data-q="${SG.esc(chat.question)}" title="${SG.esc(chat.question)}">
            ${getIcon('clock', 13)}<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${SG.esc(chat.question)}</span>
            <span class="muted" style="font-size:10px">${SG.relativeTime(chat.createdAt)}</span>
          </button>`).join('') : '<p class="muted small">还没有问过问题。</p>';
        box.querySelectorAll('[data-q]').forEach(btn => {
          btn.onclick = () => { document.getElementById('ask-input').value = btn.dataset.q; send(); };
        });
      }

      render();
    })();
  </script>
</body>
</html>
